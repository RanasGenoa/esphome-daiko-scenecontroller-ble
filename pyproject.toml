[project]
name = "esphome-daiko-scenecontroller-ble"
version = "1.0.0"
description = "ESPHome custom component for DAIKO DP-41924 6-channel scene controller over Bluetooth Mesh"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "TakumiOishi" }
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".esphome",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
